name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate an ephemeral MASTER_KEY for this run
        # Test icin gecici Fernet anahtari; repoda sabit anahtar tutulmaz.
        run: echo "MASTER_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Run test suite
        run: |
          python -m pytest -q

  secret-rotation-check:
    name: Secret Rotation Script Check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run secret rotation CI checks
        shell: pwsh
        run: |
          .\scripts\ci_secret_rotation_check.ps1
