# Render Blueprint: herkese acik tek URL'li demo dagitimi.
# Adim adim kurulum: docs/PUBLIC_DEMO_DEPLOY.md
#
# Bu blueprint yalnizca API + UI servisini yayinlar. Bridge ve edge_agent
# saha bilesenleridir; kamuya acik demoda calistirilmaz.
# Redis kurulmaz: nonce store Redis yoksa bellege duser (app/services/nonce_store.py).
#
# Veritabani Render'da kurulmaz: Render'in ucretsiz Postgres'i 30 gun sonra silinir.
# Bunun yerine suresiz ucretsiz Neon Postgres kullanilir; baglanti dizesi panelden
# DATABASE_URL olarak girilir (docs/PUBLIC_DEMO_DEPLOY.md).

services:
  - type: web
    name: hava-sahasi-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerCommand: sh /app/deploy/render/start.sh
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Neon baglanti dizesi (postgresql://...); start.sh surucu semasina cevirir.
      - key: DATABASE_URL
        sync: false

      # 10 dk gercek istek yoksa arka plan dongusu DB'yi sorgulamayi birakir;
      # /healthz uyanik tutma ping'i sayilmaz. Boylece Neon uyuyup ucretsiz
      # kotanin icinde kalir, web servisi ise ping ile hep uyanik kalir.
      - key: BACKGROUND_IDLE_AFTER_SECONDS
        value: "600"

      - key: ENVIRONMENT
        value: prod
      - key: APP_NAME
        value: Hava Sahasi Kontrol Merkezi
      - key: SECURE_COOKIES
        value: "true"

      # Render rastgele uretir; repoda hicbir sir tutulmaz.
      - key: JWT_SECRET_KEY
        generateValue: true

      # Fernet formati zorunlu oldugu icin Render uretemez -> panelden elle girilir.
      # Uretmek icin: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: MASTER_KEY
        sync: false

      # Demo giris bilgileri. prod dogrulamasi sifre icin en az 12 karakter ister.
      # README'ye YAZILMAZ; sadece paylasilacak kisilere verilir.
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

      # Salt-okunur demo hesabi: linki paylastigin kisiler bununla girer.
      # viewer rolu hicbir yazma ucuna erisemez ve kendi sifresini kalici
      # olarak degistiremez; her acilista bu degerlere geri esitlenir.
      - key: BOOTSTRAP_VIEWER_USERNAME
        value: gozlemci
      - key: BOOTSTRAP_VIEWER_PASSWORD
        sync: false

      # prod modunda "*" yasak. Ilk deploy sonrasi gercek URL farkliysa guncelle.
      - key: CORS_ORIGINS
        value: '["https://hava-sahasi-demo.onrender.com"]'

      - key: DEMO_MODE_ENABLED
        value: "true"
      - key: OPENSKY_ENABLED
        value: "true"
      - key: MAP_PROVIDER
        value: openfreemap
